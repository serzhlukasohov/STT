<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Speech to Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/stats.css">
</head>
<body>
  <div class="app stats-app">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="currentColor" opacity="0.12"/>
          <path d="M8 22V10M14 22V14M20 22V8M26 22V16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Usage analytics</h1>
        <p class="subtitle">Private dashboard — only you should have the secret</p>
      </div>
    </header>

    <section class="card" id="auth-section">
      <h2 class="stats-card-title">Access</h2>
      <p class="card-desc">Enter the same value as <code>ANALYTICS_SECRET</code> on the server.</p>
      <div class="api-row">
        <div class="input-wrap">
          <input type="password" id="stats-secret" placeholder="Analytics secret" autocomplete="off">
        </div>
        <button type="button" class="btn btn-primary" id="load-stats">View stats</button>
      </div>
      <p class="hint error-hint hidden" id="auth-error"></p>
    </section>

    <section class="stats-grid hidden" id="stats-content">
      <article class="stat-card highlight">
        <p class="stat-label">Unique visitors</p>
        <p class="stat-value" id="stat-visitors">—</p>
      </article>
      <article class="stat-card">
        <p class="stat-label">Page views</p>
        <p class="stat-value" id="stat-views">—</p>
      </article>
      <article class="stat-card">
        <p class="stat-label">Transcriptions</p>
        <p class="stat-value" id="stat-transcriptions">—</p>
        <p class="stat-sub" id="stat-transcriptions-sub"></p>
      </article>
      <article class="stat-card">
        <p class="stat-label">Downloads</p>
        <p class="stat-value" id="stat-downloads">—</p>
      </article>
      <article class="stat-card">
        <p class="stat-label">Visit → transcribe</p>
        <p class="stat-value" id="stat-conversion">—</p>
      </article>
      <article class="stat-card wide">
        <p class="stat-label">Last 14 days</p>
        <div class="chart" id="chart" role="img" aria-label="Daily activity chart"></div>
        <p class="stat-meta" id="stat-meta"></p>
      </article>
    </section>

    <p class="footer-link"><a href="/">← Back to app</a></p>
  </div>

  <script src="/js/analytics-client.js"></script>
  <script src="/js/stats.js"></script>
</body>
</html>
